<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
  <meta name="theme-color" content="#0f0f1a">
  <title>有内鬼 · 聊天内容自动销毁，不留痕</title>
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container chatroom" id="app">

  <!-- 断线提示 -->
  <div id="disconnectedBanner" class="disconnected-banner hidden">⚠️ 网络断开，正在重连...</div>

  <!-- 销毁后状态 -->
  <div id="destroyedView" class="hidden">
    <div class="empty-state">
      <div class="big-icon">🔥</div>
      <h2 style="margin-bottom:8px;">会话已销毁</h2>
      <p style="color:#888; margin-bottom:8px;">所有数据已永久清除</p>
      <p style="color:#555; margin-bottom:24px; font-size:0.78rem;">
        查看 <a href="/stats.html" style="color:#888;">📊 运行统计</a> · 该会话的销毁已被记录
      </p>
      <a class="btn btn-primary full-width" href="/">返回首页</a>
    </div>
  </div>

  <!-- 聊天室 -->
  <div id="chatView" class="hidden chatview-root">
    <div class="chat-header">
      <div class="topbar" style="margin-bottom:2px; padding:0;">
        <a href="/" class="btn btn-outline" style="width:auto; padding:4px 12px; font-size:0.8rem; margin:0;">← 离开</a>
        <div class="row">
          <img src="/img/logo.svg" alt="有内鬼" style="width:20px; height:20px;">
          <div class="countdown" id="countdown">--:--</div>
        </div>
        <div style="display:flex; gap:6px;">
          <button data-i18n-switch class="btn btn-outline" style="margin:0; padding:4px 10px; font-size:0.75rem;">EN</button>
          <button class="btn btn-outline" style="margin:0; padding:4px 10px; font-size:0.75rem;" onclick="exportMarkdown()" title="导出 Markdown（销毁前可导出）">📄</button>
          <button class="btn btn-outline btn-danger" style="margin:0; padding:4px 10px; font-size:0.75rem;" onclick="showDestroyConfirm()" title="结束会话（立即销毁，所有人断开，数据不可恢复）">🚨</button>
        </div>
      </div>
      <h2 id="roomTopic"></h2>
      <div class="room-code-row">
        <span class="room-code-label">房间号</span>
        <code class="room-code" id="roomCode"></code>
        <button class="btn btn-outline" style="margin:0; padding:2px 8px; font-size:0.7rem;" onclick="copyRoomCode()">复制</button>
      </div>
      <div class="member-list" id="memberList"></div>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="input-area" style="padding-bottom: env(safe-area-inset-bottom, 0);">
      <div class="input-row">
        <textarea id="msgInput" rows="1" placeholder="说点什么..." maxlength="2000"></textarea>
        <button type="button" class="tool-icon" id="uploadBtn" title="文件" onclick="document.getElementById('fileInput').click()">📁</button>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,audio/mpeg,audio/wav,video/mp4,.txt,.md,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.json,.csv,.zip" hidden>
        <button class="btn btn-primary send-btn" id="sendBtn">发送</button>
      </div>
    </div>

    <!-- 上传进度条 -->
    <div id="uploadBar" class="upload-bar hidden">
      <div id="uploadBarFill" class="upload-bar-fill" style="width:0%"></div>
      <span id="uploadBarText" class="upload-bar-text">0%</span>
    </div>

    <!-- 图片 Lightbox -->
    <div id="lightbox" class="lightbox hidden" onclick="document.getElementById('lightbox').classList.add('hidden')">
      <img id="lightboxImg" src="">
    </div>
  </div>

  <!-- 结束会话二次确认弹窗 -->
  <div id="destroyModal" class="modal-overlay hidden">
    <div class="modal">
      <h3>🚨 确定要结束会话吗？</h3>
      <p>结束后将立即删除所有消息数据，所有成员断开，双方都无法再发送或导出内容。<br><br>你已经做好的 Markdown 导出文件仍然保存在本地。<br><br><strong style="color:#e74c3c;">此操作不可撤销。</strong></p>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-outline" style="margin:0; flex:1;" onclick="hideDestroyConfirm()">取消</button>
        <button class="btn btn-danger" style="margin:0; flex:1;" onclick="confirmDestroy()">确定结束</button>
      </div>
    </div>
  </div>

</div>

<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
  // ============ 状态 ============
  const state = {
    roomId: null,
    user: null,
    room: null,
    ws: null,
    connected: false,
    destroyed: false,
    timerInterval: null,
    pollTimer: null,
  };

  // 全局：前端时间偏移量（服务器时间 - 浏览器时间），用于修正服务器时间漂移
  let timeOffset = 0;

  async function calibrateTime() {
    try {
      const h = await api.get('/health');
      if (h && h.serverTime) {
        timeOffset = h.serverTime - Date.now();
        console.log('[time] calibrated offset=' + timeOffset + 'ms (' + (timeOffset/1000).toFixed(1) + 's)');
      }
    } catch {}
  }

  // ============ 初始化 ============
  async function init() {
    // 先校准时间
    await calibrateTime();

    // 检查媒体功能是否启用
    try {
      const h = await api.get('/health');
      if (h && h.mediaEnabled === false) {
        const btn = document.getElementById('uploadBtn');
        if (btn) btn.style.display = 'none';
      }
    } catch { /* ignore */ }

    const user = await api.get('/auth/me');
    if (!user || !user.id) { window.location.href = '/'; return; }
    state.user = user;

    const params = new URLSearchParams(location.search);
    const roomId = params.get('room');
    if (!roomId) { window.location.href = '/'; return; }
    state.roomId = roomId;

    // 先 REST 拿到房间信息
    try {
      const r = await api.get(`/rooms/${roomId}`);
      if (!r.ok || !r.room || r.room.status !== 'active') {
        showDestroyed();
        return;
      }
      state.room = r.room;
      renderRoom(r.room);
      state.room.messages.forEach(m => renderMsg(m));
      startCountdown();

      // 再加入会话（更新成员列表）
      const joinRes = await api.post(`/rooms/${roomId}/join`);
      // 重要：join 接口返回的 room 里已经包含最新成员列表（包括自己），
      // 必须更新 state.room，否则 renderMemberList() 用的还是 join 前的旧数据
      if (joinRes && joinRes.ok && joinRes.room) {
        state.room = joinRes.room;
        renderMemberList();
      }

      // 连接 WebSocket
      connectWS();
    } catch (e) {
      showDestroyed();
    }
  }

  // ============ 渲染 ============
  function renderRoom(room) {
    document.getElementById('chatView').classList.remove('hidden');
    document.getElementById('destroyedView').classList.add('hidden');
    document.getElementById('roomTopic').textContent = room.topic;
    document.getElementById('roomCode').textContent = room.roomCode;
  }

  function copyRoomCode() {
    const code = document.getElementById('roomCode').textContent;
    const link = `${location.origin}/join/${code}`;
    const ta = document.createElement('textarea');
    ta.value = link; document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    document.body.removeChild(ta);
    if (!ok && window.navigator && window.navigator.clipboard) {
      window.navigator.clipboard.writeText(link).catch(() => {});
      ok = true;
    }
    alert(ok ? '分享链接已复制：\n' + link : '复制失败，请手动选中复制');
  }

  function renderMemberList() {
    const box = document.getElementById('memberList');
    box.innerHTML = '';
    for (const m of state.room.members) {
      const chip = document.createElement('div');
      chip.className = 'member-chip';
      chip.innerHTML = `<img src="${m.avatar || '/img/default-avatar.svg'}" alt=""><span>${m.nickname}${m.id === state.room.creatorId ? ' 👑' : ''}</span>`;
      box.appendChild(chip);
    }
  }

  function startCountdown() {
    if (state.timerInterval) clearInterval(state.timerInterval);
    if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
    const el = document.getElementById('countdown');

    const tick = () => {
      if (state.destroyed) return;
      if (!state.room || !state.room.destroyAt) {
        el.textContent = '--:--';
        return;
      }
      // 用服务器校准后的"当前时间"算差值，两边同口径
      const now = Date.now() + timeOffset;
      const remain = Math.max(0, state.room.destroyAt - now);
      const totalSec = Math.floor(remain / 1000);
      const d = Math.floor(totalSec / 86400);
      const h = Math.floor((totalSec % 86400) / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      let text = '';
      if (d > 0) text = `${d}天 ${h}h ${m}m`;
      else if (h > 0) text = `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      else text = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      el.textContent = text;

      el.classList.remove('warn', 'danger');
      if (totalSec <= 60) el.classList.add('danger');
      else if (totalSec <= 600) el.classList.add('warn');

      // 兜底：倒计时归零后主动轮询后端状态
      if (totalSec <= 0 && !state.pollTimer) {
        pollUntilDestroyed();
      }
    };
    tick();
    state.timerInterval = setInterval(tick, 1000);
  }

  /**
   * 倒计时到 0 后，每 3 秒查一次后端房间状态。
   * 兜底场景：后端 scheduler 的 setTimeout 未触发 / Pub/Sub 丢消息 / 时间漂移。
   * 一旦后端返回 destroyed，立即 showDestroyed()。
   */
  function pollUntilDestroyed() {
    let polls = 0;
    const MAX_POLLS = 60; // 最多轮询 3 分钟
    state.pollTimer = setInterval(async () => {
      if (state.destroyed) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
        return;
      }
      polls++;
      if (polls > MAX_POLLS) {
        console.warn('[countdown] pollUntilDestroyed timed out after', MAX_POLLS, 'polls');
        clearInterval(state.pollTimer);
        state.pollTimer = null;
        return;
      }
      try {
        const r = await api.get(`/rooms/${state.roomId}`);
        if (!r.ok || !r.room || r.room.status !== 'active') {
          showDestroyed();
          clearInterval(state.pollTimer);
          state.pollTimer = null;
        }
      } catch (e) {
        // 410 room_destroyed 或其他网络错误 → 尝试跳转
        showDestroyed();
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
    }, 3000);
  }

  function renderMsg(msg) {
    const area = document.getElementById('chatArea');

    if (msg.type === 'system' || msg.type === 'reminder') {
      const div = document.createElement('div');
      div.className = `sys-msg ${msg.type === 'reminder' && msg.level === 'danger' ? 'danger' : (msg.level === 'warn' ? 'warn' : '')}`;
      div.textContent = msg.content || msg.message;
      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
      return;
    }

    // 已撤回：显示占位符，不再渲染媒体气泡
    if (msg.type === 'revoked') {
      const div = document.createElement('div');
      div.className = 'msg-revoked';
      div.textContent = '— 一条消息已被撤回 —';
      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
      return;
    }

    const div = document.createElement('div');
    div.className = `msg ${msg.sender_id === state.user.id ? 'own' : ''}`;
    div.dataset.msgId = msg.id;

    // 媒体消息：image / audio / video
    let bubbleContent = '';
    if (msg.type === 'image') {
      bubbleContent = `<img class="media-img" src="${msg.public_url}" loading="lazy" onclick="document.getElementById('lightboxImg').src='${msg.public_url}';document.getElementById('lightbox').classList.remove('hidden')">`;
    } else if (msg.type === 'audio') {
      bubbleContent = `<audio class="media-audio" src="${msg.public_url}" controls></audio>`;
    } else if (msg.type === 'video') {
      bubbleContent = `<video class="media-video" src="${msg.public_url}" controls preload="metadata"></video>`;
    } else if (msg.type === 'document') {
      const fileName = msg.original_name || (msg.file_key || '').split('/').pop() || '文档';
      const ext = fileName.split('.').pop() || '';
      bubbleContent = `
        <a class="media-doc" href="${msg.public_url}" download target="_blank">
          <div class="doc-icon">📄</div>
          <div class="doc-info">
            <div class="doc-name">${fileName}</div>
            <div class="doc-meta">${ext.toUpperCase()} · ${formatSize(msg.size || 0)}</div>
          </div>
          <div class="doc-download">⬇</div>
        </a>`;
    } else {
      // text（旧消息没有 type 字段也当 text）
      bubbleContent = ''; // 后面 textContent 设置
    }

    // 自己发的消息显示撤回按钮
    const revokeBtn = msg.sender_id === state.user.id
      ? `<button class="revoke-btn" onclick="revokeMsg('${msg.id}')" title="撤回">撤回</button>`
      : '';

    div.innerHTML = `
      <img class="avatar" src="${msg.sender_avatar || '/img/default-avatar.svg'}" alt="">
      <div>
        <div class="bubble-wrap">
          <div class="bubble">${bubbleContent}</div>
          ${revokeBtn}
        </div>
        <div class="meta">${msg.sender_nickname} · ${new Date(msg.timestamp).toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' })}</div>
      </div>
    `;

    // text 消息用 textContent（防 XSS），media 消息已经用 innerHTML 安全渲染
    if (msg.type !== 'image' && msg.type !== 'audio' && msg.type !== 'video' && msg.type !== 'document') {
      div.querySelector('.bubble').textContent = msg.content || msg.message || '';
    }

    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  // ============ 撤回消息 ============
  function revokeMsg(msgId) {
    if (!state.ws || state.ws.readyState !== 1) return;
    if (!confirm('确定撤回这条消息吗？所有人都将看不到。')) return;
    state.ws.send(JSON.stringify({ type: 'revoke', msgId }));
  }

  function showDestroyed() {
    state.destroyed = true;
    document.getElementById('chatView').classList.add('hidden');
    document.getElementById('destroyedView').classList.remove('hidden');
    if (state.timerInterval) clearInterval(state.timerInterval);
    if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
    if (state.ws) state.ws.close();
  }

  // ============ WebSocket ============
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const sid = getCookie('yg.sid') || getCookie('connect.sid');
    console.log('[WS] roomId=', state.roomId, 'sid=', sid ? sid.slice(0, 20) + '...' : 'EMPTY');
    const url = `${proto}//${location.host}/ws?roomId=${state.roomId}&sid=${encodeURIComponent(sid)}`;

    try {
      state.ws = new WebSocket(url);
    } catch {
      // 无 Redis 时后端不启用 WS
      const area = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = 'sys-msg warn';
      div.textContent = '⚠️ WebSocket 不可用（Redis 未启动），请启动 Redis 后刷新页面';
      area.appendChild(div);
      return;
    }

    state.ws.onopen = () => {
      state.connected = true;
      document.getElementById('disconnectedBanner').classList.add('hidden');
      state.ws.send(JSON.stringify({
        type: 'hello',
        userId: state.user.id,
        nickname: state.user.nickname,
        avatar: state.user.avatar,
      }));
    };

    state.ws.onclose = () => {
      state.connected = false;
      if (!state.destroyed) {
        document.getElementById('disconnectedBanner').classList.remove('hidden');
        // 简单重连
        setTimeout(() => connectWS(), 3000);
      }
    };

    state.ws.onerror = () => {};

    state.ws.onmessage = (ev) => {
      let data;
      try { data = JSON.parse(ev.data); } catch { return; }
      handleWSMessage(data);
    };
  }

  function handleWSMessage(data) {
    switch (data.type) {
      case 'chat':
        renderMsg(data.message);
        // 更新本地 room 消息数（刷新时用）
        if (state.room) {
          state.room.messages.push(data.message);
        }
        break;

      case 'room_destroyed':
        const nick = data.actorNickname ? `「${data.actorNickname}」` : '系统';
        const div = document.createElement('div');
        div.className = 'sys-msg danger';
        div.textContent = `${nick} 已结束会话`;
        document.getElementById('chatArea').appendChild(div);
        showDestroyed();
        break;

      case 'member_left':
        renderMsg({
          type: 'system',
          content: `「${data.member.nickname}」已退出会话`,
        });
        break;

      case 'destroy_time_updated':
        // 刷新 destroyAt
        if (state.room) {
          state.room.destroyAt = data.new_destroy_at;
          startCountdown();
        }
        break;

      case 'remind_1h':
      case 'remind_10min':
        renderMsg({ type: 'reminder', level: 'warn', message: data.message });
        break;
      case 'remind_1min':
        renderMsg({ type: 'reminder', level: 'danger', message: data.message });
        break;

      case 'msg_revoked': {
        // 找到那条消息的 DOM，替换成撤回占位
        const old = document.querySelector(`.msg[data-msg-id="${data.msgId}"]`);
        if (old) {
          const placeholder = document.createElement('div');
          placeholder.className = 'msg-revoked';
          placeholder.textContent = '— 一条消息已被撤回 —';
          old.replaceWith(placeholder);
        }
        break;
      }

      case 'error':
        if (data.error === 'room_destroyed') showDestroyed();
        else if (data.error === 'flood_detected') {
          renderMsg({ type: 'reminder', level: 'warn', message: '⚠️ ' + (data.detail || '发送过快，请稍后再试') });
        }
        break;
    }
  }

  // ============ 发送消息 ============
  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    // 如果 WebSocket 不可用，走 REST fallback
    if (state.connected && state.ws) {
      state.ws.send(JSON.stringify({ type: 'chat', content: text }));
    } else {
      // REST fallback：通过轮询实现（MVP 暂不做，直接提示）
      alert('WebSocket 未连接，消息发送失败。请启动 Redis 后刷新页面。');
      return;
    }

    input.value = '';
    input.style.height = 'auto';
  }

  /**
   * 上传媒体文件 → POST /api/media/upload → 拿返回值 → 发 WS chat 消息
   */
  async function uploadMedia(file) {
    if (!state.connected || !state.ws) {
      alert('WebSocket 未连接，无法上传媒体。请刷新页面重试。');
      return;
    }
    if (state.destroyed) return;

    // 根据 MIME 推断 type
    const mime = file.type;
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const docExts = ['txt','md','pdf','doc','docx','xls','xlsx','ppt','pptx','json','csv','zip'];
    let mediaType = null;
    if (mime.startsWith('image/')) mediaType = 'image';
    else if (mime.startsWith('audio/')) mediaType = 'audio';
    else if (mime.startsWith('video/')) mediaType = 'video';
    else if (docExts.includes(ext)) mediaType = 'document';
    if (!mediaType) { alert('不支持的文件类型: ' + mime + (ext ? ' .' + ext : '')); return; }

    // 单文件大小检查
    const maxPerType = { image: 5 * 1024 * 1024, audio: 20 * 1024 * 1024, video: 50 * 1024 * 1024, document: 20 * 1024 * 1024 };
    const typeLabel = { image: '图片', audio: '音频', video: '视频', document: '文档' }[mediaType];
    if (file.size > maxPerType[mediaType]) {
      alert(`${typeLabel}文件过大（最大 ${(maxPerType[mediaType]/1024/1024).toFixed(0)}MB）`);
      return;
    }

    // 显示进度条
    const bar = document.getElementById('uploadBar');
    const fill = document.getElementById('uploadBarFill');
    const text = document.getElementById('uploadBarText');
    bar.classList.remove('hidden');
    fill.style.width = '0%';
    text.textContent = '0%';
    let processing = false;

    try {
      const result = await new Promise((resolve, reject) => {
        const fd = new FormData();
        fd.append('roomId', state.roomId);
        fd.append('file', file);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/media/upload');
        xhr.withCredentials = true;
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const pct = Math.round(e.loaded / e.total * 100);
            fill.style.width = pct + '%';
            if (pct < 100) {
              text.textContent = `${pct}%（上传中）`;
            } else if (!processing) {
              processing = true;
              // 100% 后：视频提示转码中，非视频直接显示完成等返回
              if (mediaType === 'video') {
                text.textContent = '🔄 上传完成，视频处理中...';
                bar.classList.add('processing');  // 变绿色 + 呼吸动画
              } else {
                text.textContent = '100%';
              }
            }
          }
        };
        xhr.onload = () => {
          let data = {};
          try { data = JSON.parse(xhr.responseText); } catch {}
          resolve({ status: xhr.status, ok: xhr.status >= 200 && xhr.status < 300, data });
        };
        xhr.onerror = () => reject(new Error('network_error'));
        xhr.send(fd);
      });

      if (!result.ok) {
        const body = result.data;
        const s = result.status;
        if (s === 410) alert('会话已结束，无法上传');
        else if (body.error === 'room_quota_exceeded') alert('⚠️ ' + (body.detail || '房间媒体配额已满'));
        else if (body.error === 'quota_exceeded') alert('⚠️ ' + (body.detail || '房间媒体配额已满'));
        else if (body.error === 'too_large') alert('⚠️ ' + (body.detail || '文件过大'));
        else if (body.error === 'type_not_allowed') alert('⚠️ ' + (body.detail || '不支持的文件类型'));
        else alert('⚠️ 上传失败: ' + (body.detail || s));
        return;
      }

      const r = result.data;
      if (!r.ok) throw new Error('upload_failed');

      // 上传成功 → 发 WS chat 消息（携带 media 元数据）
      state.ws.send(JSON.stringify({
        type: 'chat',
        media: {
          type: mediaType,
          fileKey: r.fileKey,
          publicUrl: r.publicUrl,
          mime: r.mime,
          size: r.size,
          originalName: r.originalName || file.name,
        },
      }));
    } catch (e) {
      console.error('[media] upload error:', e.message);
      alert('上传失败，请重试');
    } finally {
      // 隐藏进度条 + 清理 processing 状态
      bar.classList.remove('processing');
      setTimeout(() => bar.classList.add('hidden'), 300);
    }
  }

  // ============ 结束会话 ============
  function showDestroyConfirm() {
    document.getElementById('destroyModal').classList.remove('hidden');
  }
  function hideDestroyConfirm() {
    document.getElementById('destroyModal').classList.add('hidden');
  }
  async function confirmDestroy() {
    hideDestroyConfirm();
    try {
      await api.post(`/rooms/${state.roomId}/destroy`);
      // 销毁事件会通过 WS 推回来；如果没 WS，直接跳转
      showDestroyed();
    } catch (e) {
      alert('结束会话失败');
    }
  }

  // ============ Markdown 导出 ============
  function exportMarkdown() {
    const t = window.i18n ? window.i18n.t : (x) => x;
    if (state.destroyed) { alert(t('会话已销毁，无法导出')); return; }
    const url = `/api/export/${state.roomId}?lang=${window.i18n ? window.i18n.current : 'zh'}`;
    window.open(url, '_blank');
  }

  // ============ 输入区 ============
  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('msgInput');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });
    document.getElementById('sendBtn').onclick = sendMessage;

    // 综合文件上传（飞书风格：一个 📁 按钮接受所有类型）
    const fileInput = document.getElementById('fileInput');
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      e.target.value = ''; // 允许重复选同一个文件
      // 自动识别类型（和 uploadMedia 内部一致）
      const mime = file.type;
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      const docExts = ['txt','md','pdf','doc','docx','xls','xlsx','ppt','pptx','json','csv','zip'];
      let mediaType = null;
      if (mime.startsWith('image/')) mediaType = 'image';
      else if (mime.startsWith('audio/')) mediaType = 'audio';
      else if (mime.startsWith('video/')) mediaType = 'video';
      else if (docExts.includes(ext)) mediaType = 'document';
      if (!mediaType) { alert('不支持的文件类型'); return; }
      await uploadMedia(file);
    });

    // 离开时发送退出事件
    window.addEventListener('beforeunload', async () => {
      if (!state.destroyed && state.roomId) {
        try { await api.post(`/rooms/${state.roomId}/leave`); } catch {}
      }
    });
  });

  // ============ 工具 ============
  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    return (bytes / 1024 / 1024 / 1024).toFixed(1) + ' GB';
  }

  function getCookie(name) {
    const m = document.cookie.match(new RegExp(`(?:^|; )${name.replace(/[-[\]/\\^$*+?.()|{}]/g, '\\$&')}=([^;]*)`));
    return m ? decodeURIComponent(m[1]) : '';
  }

  init();
</script>
</body>
</html>
