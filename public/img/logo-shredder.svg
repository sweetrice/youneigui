<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="shredBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8f0"/>
      <stop offset="100%" stop-color="#a0a0b0"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- 碎纸机主体 -->
  <rect x="144" y="280" width="224" height="140" rx="12" ry="12" fill="url(#shredBody)" stroke="#3d4758" stroke-width="2"/>
  <rect x="152" y="292" width="208" height="10" rx="3" fill="#0a0a12"/>
  
  <!-- 碎纸机口 -->
  <rect x="200" y="268" width="112" height="20" rx="4" ry="4" fill="#0a0a12"/>
  
  <!-- 碎纸机齿轮纹路（侧面） -->
  <g stroke="#4a5568" stroke-width="1.5" fill="none">
    <line x1="160" y1="320" x2="180" y2="320"/>
    <line x1="160" y1="340" x2="180" y2="340"/>
    <line x1="160" y1="360" x2="180" y2="360"/>
    <line x1="160" y1="380" x2="180" y2="380"/>
    <line x1="332" y1="320" x2="352" y2="320"/>
    <line x1="332" y1="340" x2="352" y2="340"/>
    <line x1="332" y1="360" x2="352" y2="360"/>
    <line x1="332" y1="380" x2="352" y2="380"/>
  </g>

  <!-- 控制按钮 -->
  <circle cx="200" cy="360" r="14" fill="#0a0a12" stroke="#444" stroke-width="2"/>
  <circle cx="200" cy="360" r="5" fill="url(#blade)"/>
  
  <!-- 红色终止灯 -->
  <circle cx="312" cy="360" r="8" fill="#ff4757" filter="url(#glow)"/>
  <text x="312" y="396" font-family="SF Mono, Menlo, monospace" font-size="9" fill="#ff4757" text-anchor="middle">STOP</text>

  <!-- 刀片（红色旋转） -->
  <g transform="translate(256, 296)">
    <rect x="-2" y="-12" width="4" height="24" fill="url(#blade)" rx="2"/>
    <rect x="-12" y="-2" width="24" height="4" fill="url(#blade)" rx="2"/>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
  </g>

  <!-- 被碎的纸条（正在进入碎纸机） -->
  <g filter="url(#paperShadow)">
    <!-- 纸条上半截（完整，还没进碎纸机） -->
    <rect x="180" y="148" width="152" height="120" rx="4" fill="url(#paper)"/>
    <rect x="180" y="148" width="152" height="120" rx="4" fill="none" stroke="#888" stroke-width="1"/>
    
    <!-- 纸条上的聊天内容 -->
    <g font-family="SF Mono, Menlo, monospace" fill="#333">
      <circle cx="196" cy="168" r="5" fill="#e74c3c"/>
      <rect x="206" y="164" width="60" height="7" rx="2" fill="#555"/>
      
      <circle cx="196" cy="190" r="5" fill="#3498db"/>
      <rect x="206" y="186" width="80" height="7" rx="2" fill="#555"/>
      
      <circle cx="196" cy="212" r="5" fill="#e74c3c"/>
      <rect x="206" y="208" width="45" height="7" rx="2" fill="#555"/>
      <rect x="206" y="220" width="70" height="7" rx="2" fill="#555"/>
      
      <rect x="188" y="238" width="136" height="2" fill="#ddd"/>
      <rect x="188" y="244" width="100" height="4" rx="2" fill="#bbb"/>
    </g>

    <!-- 纸条下半截正在被切碎的效果（碎纸机口以下） -->
    <g>
      <!-- 被切碎的纸条条 -->
      <rect x="180" y="268" width="8" height="28" fill="#d0d0dc"/>
      <rect x="190" y="268" width="8" height="24" fill="#d0d0dc"/>
      <rect x="200" y="268" width="8" height="30" fill="#d0d0dc"/>
      <rect x="210" y="268" width="8" height="22" fill="#d0d0dc"/>
      <rect x="220" y="268" width="8" height="26" fill="#d0d0dc"/>
      <rect x="230" y="268" width="8" height="30" fill="#d0d0dc"/>
      <rect x="240" y="268" width="8" height="20" fill="#d0d0dc"/>
      <rect x="250" y="268" width="8" height="28" fill="#d0d0dc"/>
      <rect x="260" y="268" width="8" height="26" fill="#d0d0dc"/>
      <rect x="270" y="268" width="8" height="22" fill="#d0d0dc"/>
      <rect x="280" y="268" width="8" height="30" fill="#d0d0dc"/>
      <rect x="290" y="268" width="8" height="24" fill="#d0d0dc"/>
      <rect x="300" y="268" width="8" height="28" fill="#d0d0dc"/>
      <rect x="310" y="268" width="8" height="22" fill="#d0d0dc"/>
    </g>
  </g>

  <!-- 底部烧起来的纸屑（暗示"聊完即焚"） -->
  <g opacity="0.9">
    <rect x="195" y="428" width="4" height="16" fill="#ff6b35"/>
    <rect x="200" y="422" width="4" height="22" fill="#f7931e"/>
    <rect x="208" y="418" width="4" height="26" fill="#ff4757"/>
    <rect x="216" y="424" width="4" height="20" fill="#f7931e"/>
    <rect x="224" y="420" width="4" height="24" fill="#ff4757"/>
    <rect x="232" y="416" width="4" height="28" fill="#ff6b35"/>
    <rect x="240" y="422" width="4" height="22" fill="#f7931e"/>
    <rect x="248" y="418" width="4" height="26" fill="#ff4757"/>
    <rect x="256" y="414" width="4" height="30" fill="#ff6b35"/>
    <rect x="264" y="420" width="4" height="24" fill="#ff4757"/>
    <rect x="272" y="418" width="4" height="26" fill="#f7931e"/>
    <rect x="280" y="422" width="4" height="22" fill="#ff6b35"/>
    <rect x="288" y="416" width="4" height="28" fill="#ff4757"/>
    <rect x="296" y="424" width="4" height="20" fill="#f7931e"/>
    <rect x="304" y="420" width="4" height="24" fill="#ff4757"/>
    <rect x="312" y="426" width="4" height="18" fill="#ff6b35"/>
  </g>
  <!-- 火焰底部光晕 -->
  <ellipse cx="256" cy="446" rx="80" ry="8" fill="#ff4757" opacity="0.3" filter="url(#glow)"/>

  <!-- 底部产品名 -->
  <text x="256" y="486" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="22" fill="#e8e8f0" font-weight="600" text-anchor="middle">有内鬼</text>
</svg>
