<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="rec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  
  <!-- 扫描线效果 -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="80" x2="512" y2="80"/>
    <line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="0" y1="240" x2="512" y2="240"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="400" x2="512" y2="400"/>
  </g>
  
  <!-- 监视器外框 -->
  <rect x="96" y="120" width="320" height="200" rx="12" ry="12" fill="none" stroke="#2d3748" stroke-width="3"/>
  <rect x="108" y="132" width="296" height="176" rx="6" ry="6" fill="#0a0a12" stroke="#1a1a2e" stroke-width="1"/>
  
  <!-- 监视器支架 -->
  <rect x="228" y="320" width="56" height="8" fill="#2d3748"/>
  <rect x="208" y="328" width="96" height="6" fill="#1a1a2e"/>
  
  <!-- REC 红色圆点 -->
  <circle cx="132" cy="156" r="10" fill="url(#rec)" filter="url(#glow)"/>
  <text x="150" y="162" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#ff4757" font-weight="600">REC</text>
  
  <!-- 监视器内的终止符号（STOP 八角形） -->
  <polygon points="256,180 292,194 306,230 292,266 256,280 220,266 206,230 220,194" 
           fill="none" stroke="#e74c3c" stroke-width="4" filter="url(#glow)"/>
  <text x="256" y="240" font-family="-apple-system, sans-serif" font-size="32" fill="#e74c3c" font-weight="700" text-anchor="middle" dominant-baseline="middle">!</text>
  
  <!-- 底部文字 -->
  <text x="256" y="420" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="28" fill="#e8e8f0" font-weight="600" text-anchor="middle">有内鬼</text>
  <text x="256" y="452" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#666" text-anchor="middle" letter-spacing="4">CANCEL TRANSACTION</text>
</svg>
